<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2438"/>
      <stop offset="100%" stop-color="#0d101d"/>
    </linearGradient>

    <!-- 赤ぷよグラデーション -->
    <radialGradient id="redPuyo" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="40%" stop-color="#f5365c"/>
      <stop offset="85%" stop-color="#c91038"/>
      <stop offset="100%" stop-color="#8a0520"/>
    </radialGradient>

    <!-- 青/緑ぷよグラデーション -->
    <radialGradient id="greenPuyo" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#69f0ae"/>
      <stop offset="40%" stop-color="#2ecc71"/>
      <stop offset="85%" stop-color="#1b8e4b"/>
      <stop offset="100%" stop-color="#0d5229"/>
    </radialGradient>

    <!-- 影フィルター -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- アイコン背景角丸スクエア -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#3b486b" stroke-width="4" opacity="0.6"/>

  <!-- 緑ぷよ（右後ろ） -->
  <g filter="url(#shadow)">
    <!-- ドロップシャドウ用ベース -->
    <ellipse cx="325" cy="275" rx="130" ry="125" fill="url(#greenPuyo)"/>
    <!-- リムライト（下部反射） -->
    <path d="M 230 320 Q 325 385 420 320" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" opacity="0.35"/>
    <!-- 上部グロスハイライト -->
    <ellipse cx="285" cy="195" rx="40" ry="24" fill="#ffffff" opacity="0.85" transform="rotate(-25 285 195)"/>
    <circle cx="265" cy="182" r="10" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="380" cy="330" rx="14" ry="9" fill="#ffffff" opacity="0.4" transform="rotate(20 380 330)"/>

    <!-- 目（右ぷよ） -->
    <!-- 左目 -->
    <ellipse cx="295" cy="260" rx="24" ry="28" fill="#111827"/>
    <ellipse cx="295" cy="258" rx="21" ry="25" fill="#ffffff"/>
    <circle cx="297" cy="260" r="12" fill="#111827"/>
    <circle cx="293" cy="254" r="5" fill="#ffffff"/>
    <circle cx="302" cy="265" r="2.5" fill="#ffffff"/>

    <!-- 右目 -->
    <ellipse cx="355" cy="260" rx="24" ry="28" fill="#111827"/>
    <ellipse cx="355" cy="258" rx="21" ry="25" fill="#ffffff"/>
    <circle cx="357" cy="260" r="12" fill="#111827"/>
    <circle cx="353" cy="254" r="5" fill="#ffffff"/>
    <circle cx="362" cy="265" r="2.5" fill="#ffffff"/>
  </g>

  <!-- 赤ぷよ（左手前） -->
  <g filter="url(#shadow)">
    <!-- 本体 -->
    <ellipse cx="195" cy="305" rx="140" ry="135" fill="url(#redPuyo)"/>
    <!-- リムライト（下部反射） -->
    <path d="M 90 355 Q 195 425 300 355" fill="none" stroke="#fecdd3" stroke-width="14" stroke-linecap="round" opacity="0.4"/>
    <!-- メイン光沢ハイライト -->
    <ellipse cx="150" cy="215" rx="46" ry="26" fill="#ffffff" opacity="0.88" transform="rotate(-30 150 215)"/>
    <circle cx="128" cy="202" r="12" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="255" cy="365" rx="16" ry="10" fill="#ffffff" opacity="0.45" transform="rotate(25 255 365)"/>

    <!-- 目（左ぷよ） -->
    <!-- 左目 -->
    <ellipse cx="160" cy="290" rx="26" ry="30" fill="#111827"/>
    <ellipse cx="160" cy="288" rx="23" ry="27" fill="#ffffff"/>
    <circle cx="163" cy="290" r="13" fill="#111827"/>
    <circle cx="158" cy="284" r="5.5" fill="#ffffff"/>
    <circle cx="167" cy="296" r="2.5" fill="#ffffff"/>

    <!-- 右目 -->
    <ellipse cx="225" cy="290" rx="26" ry="30" fill="#111827"/>
    <ellipse cx="225" cy="288" rx="23" ry="27" fill="#ffffff"/>
    <circle cx="228" cy="290" r="13" fill="#111827"/>
    <circle cx="223" cy="284" r="5.5" fill="#ffffff"/>
    <circle cx="232" cy="296" r="2.5" fill="#ffffff"/>
  </g>
</svg>
